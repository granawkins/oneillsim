<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanford Torus Simulation</title>
    <link rel="stylesheet" href="/src/styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="overlay">
        <h1>Click to Enter Station</h1>
    </div>

    <div id="ui">
        <h2 style="margin: 0 0 5px 0;">Stanford Torus</h2>
        <p style="margin: 0;">Central Sun Line Enabled</p>
        <div class="controls-hint">WASD: Move | SPACE/SHIFT: Up/Down</div>
        <div class="controls-hint">MOUSE: Look | ESC: Unlock Mouse</div>
        <div class="controls-hint" style="color:#ff6666; margin-top:5px;">Gravity is inverted (Camera Flipped).</div>
    </div>
    <div id="crosshair"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
