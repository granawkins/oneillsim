<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Neill Cylinder Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.5;
        }
        .controls-hint { font-size: 0.8rem; color: #aaa; margin-top: 5px; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Click to Enter Station</h1>
    </div>
    
    <div id="ui">
        <h2 style="margin: 0 0 5px 0;">O'Neill Cylinder</h2>
        <p style="margin: 0;">Central Sun Line Enabled</p>
        <div class="controls-hint">WASD: Move | SPACE/SHIFT: Up/Down</div>
        <div class="controls-hint">MOUSE: Look | ESC: Unlock Mouse</div>
        <div class="controls-hint" style="color:#ff6666; margin-top:5px;">Gravity is inverted (Camera Flipped).</div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, habitatGroup, stars;
        let rotationSpeed = 0.002;
        
        // Movement State
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            up: false,
            down: false
        };
        const moveSpeed = 1.2;
        const mouseSensitivity = 0.002;
        
        let cameraAnchor = new THREE.Group();
        let yaw = 0;
        let pitch = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            habitatGroup = new THREE.Group();
            scene.add(habitatGroup);

            habitatGroup.add(cameraAnchor);
            cameraAnchor.add(camera);
            cameraAnchor.position.set(0, 95, 200);

            // 1. CREATE CENTRAL LIGHT BAR (SUN LINE)
            createSunLine();

            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            createCylinder();
            createStars();
            createWorldFeatures();

            setupControls();
            animate();
        }

        function createSunLine() {
            const length = 1200;
            const sunLineGeo = new THREE.CylinderGeometry(2, 2, length, 16);
            const sunLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const sunLineMesh = new THREE.Mesh(sunLineGeo, sunLineMat);
            sunLineMesh.rotation.x = Math.PI / 2;
            habitatGroup.add(sunLineMesh);

            // Add point lights along the bar to simulate the line source
            const lightCount = 6;
            for(let i = 0; i < lightCount; i++) {
                const pLight = new THREE.PointLight(0xfff0dd, 1.5, 600);
                pLight.position.z = (i / (lightCount-1) - 0.5) * length;
                habitatGroup.add(pLight);
            }
        }

        function setupControls() {
            const overlay = document.getElementById('overlay');
            overlay.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                overlay.style.display = document.pointerLockElement === document.body ? 'none' : 'flex';
            });

            const onKey = (val) => (e) => {
                switch(e.code) {
                    case 'KeyW': moveState.forward = val; break;
                    case 'KeyS': moveState.backward = val; break;
                    case 'KeyA': moveState.left = val; break;
                    case 'KeyD': moveState.right = val; break;
                    case 'Space': moveState.up = val; break;
                    case 'ShiftLeft': moveState.down = val; break;
                }
            };
            document.addEventListener('keydown', onKey(true));
            document.addEventListener('keyup', onKey(false));

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * mouseSensitivity;
                    pitch -= e.movementY * mouseSensitivity;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createCylinder() {
            const radius = 100;
            const length = 1200;
            
            const geometry = new THREE.CylinderGeometry(radius, radius, length, 64, 1, true);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a0a, 
                side: THREE.BackSide,
                roughness: 1.0
            });
            const hull = new THREE.Mesh(geometry, material);
            hull.rotation.x = Math.PI / 2;
            habitatGroup.add(hull);

            const groundGeo = new THREE.CylinderGeometry(radius - 0.2, radius - 0.2, length, 64, 1, true);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e3511, side: THREE.BackSide });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = Math.PI/2;
            habitatGroup.add(ground);
        }

        function createStars() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 10000;
            const posArray = new Float32Array(starCount * 3);
            for(let i = 0; i < starCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 5000;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars); 
        }

        function createWorldFeatures() {
            const radius = 99.8;
            const length = 1100;

            const riverGeo = new THREE.PlaneGeometry(8, length);
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x1e56a0, side: THREE.DoubleSide, metalness: 0.5, roughness: 0.2 });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = Math.PI/2;
            river.position.set(0, -radius + 0.5, 0); 
            habitatGroup.add(river);

            // MOUNTAIN RANGE FIX
            const mountainCount = 15;
            // Peaks should point to center: we rotate them properly now
            const mtnGeo = new THREE.ConeGeometry(35, 70, 4);
            const mtnMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.9 });
            
            for (let i = 0; i < mountainCount; i++) {
                const mtn = new THREE.Mesh(mtnGeo, mtnMat);
                const angle = Math.PI + (Math.random() - 0.5) * 0.6;
                const z = (i / mountainCount - 0.5) * length;
                
                mtn.position.set(radius * Math.cos(angle), radius * Math.sin(angle), z);
                
                // Point top toward center: Cone naturally points along Y axis. 
                // We make it look at the center (0,0,z).
                mtn.lookAt(0, 0, z);
                // After lookAt, the tip points along Z. We need to rotate it back so tip is local Up.
                mtn.rotateX(Math.PI / 2); 
                
                mtn.scale.x = 1.2 + Math.random();
                habitatGroup.add(mtn);
            }

            createTown(new THREE.Vector3(50, -85, 200), 40); 
            createTown(new THREE.Vector3(-60, -80, -250), 30); 
            createForest(800);
        }

        function createTown(center, count) {
            const radius = 99.5;
            const houseBaseGeo = new THREE.BoxGeometry(2, 2, 2);
            const houseRoofGeo = new THREE.ConeGeometry(1.8, 1.5, 4);
            
            for (let i = 0; i < count; i++) {
                const offsetTheta = (Math.random() - 0.5) * 0.4;
                const offsetZ = (Math.random() - 0.5) * 50;
                const baseAngle = Math.atan2(center.y, center.x);
                const theta = baseAngle + offsetTheta;
                const z = center.z + offsetZ;

                const group = new THREE.Group();
                const base = new THREE.Mesh(houseBaseGeo, new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
                const roof = new THREE.Mesh(houseRoofGeo, new THREE.MeshStandardMaterial({ color: 0x882222 }));
                roof.position.y = 1.75;
                group.add(base, roof);

                group.position.set(radius * Math.cos(theta), radius * Math.sin(theta), z);
                group.lookAt(0, 0, z);
                group.rotateX(-Math.PI / 2);
                habitatGroup.add(group);
            }
        }

        function createForest(count) {
            const radius = 99.5;
            const length = 1000;
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.2, 2);
            const leavesGeo = new THREE.SphereGeometry(1.5, 8, 8);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x1a3d16 });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2b1d0e });

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const z = (Math.random() - 0.5) * length;
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                const leaves = new THREE.Mesh(leavesGeo, leafMat);
                leaves.position.y = 1.5;
                group.add(trunk, leaves);

                group.position.set(radius * Math.cos(theta), radius * Math.sin(theta), z);
                group.lookAt(0, 0, z);
                group.rotateX(-Math.PI / 2);
                habitatGroup.add(group);
            }
        }

        function updateMovement() {
            const currentPos = new THREE.Vector2(cameraAnchor.position.x, cameraAnchor.position.y);
            const angle = Math.atan2(currentPos.y, currentPos.x);
            
            cameraAnchor.rotation.z = angle - Math.PI/2 + Math.PI;

            const direction = new THREE.Vector3();
            const front = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

            if (moveState.forward) direction.add(front);
            if (moveState.backward) direction.sub(front);
            if (moveState.right) direction.add(right);
            if (moveState.left) direction.sub(right);
            if (moveState.up) direction.add(up);
            if (moveState.down) direction.sub(up);

            if (direction.length() > 0) {
                direction.normalize().multiplyScalar(moveSpeed);
                direction.applyQuaternion(cameraAnchor.quaternion);
                cameraAnchor.position.add(direction);
            }

            const distFromCenter = Math.sqrt(cameraAnchor.position.x**2 + cameraAnchor.position.y**2);
            if (distFromCenter > 98) {
                const ratio = 98 / distFromCenter;
                cameraAnchor.position.x *= ratio;
                cameraAnchor.position.y *= ratio;
            } else if (distFromCenter < 3) { // Slightly larger deadzone for the sun bar
                cameraAnchor.position.x = 3.1;
            }
            
            if (Math.abs(cameraAnchor.position.z) > 550) {
                cameraAnchor.position.z = Math.sign(cameraAnchor.position.z) * 550;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            habitatGroup.rotation.z += rotationSpeed;
            stars.rotation.y += 0.00005;

            if (document.pointerLockElement === document.body) {
                updateMovement();
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
