<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Neill Cylinder Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.5;
        }
        .controls-hint { font-size: 0.8rem; color: #aaa; margin-top: 5px; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Click to Enter Station</h1>
    </div>
    
    <div id="ui">
        <h2 style="margin: 0 0 5px 0;">O'Neill Cylinder</h2>
        <p style="margin: 0;">Central Sun Line Enabled</p>
        <div class="controls-hint">WASD: Move | SPACE/SHIFT: Up/Down</div>
        <div class="controls-hint">MOUSE: Look | ESC: Unlock Mouse</div>
        <div class="controls-hint" style="color:#ff6666; margin-top:5px;">Gravity is inverted (Camera Flipped).</div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, habitatGroup, stars;
        let rotationSpeed = Math.PI / 1800; // 1 RPM at 60fps
        
        // Movement State
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            up: false,
            down: false
        };
        const moveSpeed = 1.2;
        const mouseSensitivity = 0.002;
        
        let cameraAnchor = new THREE.Group();
        let yaw = 0;
        let pitch = 0;
        let sunRingMesh = null;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            habitatGroup = new THREE.Group();
            scene.add(habitatGroup);

            habitatGroup.add(cameraAnchor);
            cameraAnchor.add(camera);
            cameraAnchor.position.set(0, 620, 0);

            // Create ring light above the river
            createSunRing();

            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            createCylinder();
            createStars();
            createWorldFeatures();

            setupControls();
            animate();
        }

        function createSunRing() {
            const ringRadius = 650 - 65; // 65m above ground surface (toward center)
            const ringZ = 20; // above the river

            // Visible ring geometry
            const ringGeo = new THREE.TorusGeometry(ringRadius, 3, 8, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            sunRingMesh = new THREE.Mesh(ringGeo, ringMat);
            sunRingMesh.position.z = ringZ;
            habitatGroup.add(sunRingMesh);

            // Add point lights around the ring
            const lightCount = 12;
            for (let i = 0; i < lightCount; i++) {
                const angle = (i / lightCount) * Math.PI * 2;
                const pLight = new THREE.PointLight(0xfff8e0, 0.6, 400);
                pLight.position.set(
                    ringRadius * Math.cos(angle),
                    ringRadius * Math.sin(angle),
                    ringZ
                );
                habitatGroup.add(pLight);
            }
        }

        function setupControls() {
            const overlay = document.getElementById('overlay');
            overlay.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                overlay.style.display = document.pointerLockElement === document.body ? 'none' : 'flex';
            });

            const onKey = (val) => (e) => {
                switch(e.code) {
                    case 'KeyW': moveState.forward = val; break;
                    case 'KeyS': moveState.backward = val; break;
                    case 'KeyA': moveState.left = val; break;
                    case 'KeyD': moveState.right = val; break;
                    case 'Space': moveState.up = val; break;
                    case 'ShiftLeft': moveState.down = val; break;
                }
            };
            document.addEventListener('keydown', onKey(true));
            document.addEventListener('keyup', onKey(false));

            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyL' && sunRingMesh) {
                    sunRingMesh.visible = !sunRingMesh.visible;
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * mouseSensitivity;
                    pitch -= e.movementY * mouseSensitivity;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createCylinder() {
            const radius = 650;
            const length = 130;
            
            const geometry = new THREE.CylinderGeometry(radius, radius, length, 64, 1, true);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a0a, 
                side: THREE.BackSide,
                roughness: 1.0
            });
            const hull = new THREE.Mesh(geometry, material);
            hull.rotation.x = Math.PI / 2;
            habitatGroup.add(hull);

            const groundGeo = new THREE.CylinderGeometry(radius - 0.2, radius - 0.2, length, 64, 1, true);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d4a28, side: THREE.BackSide, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = Math.PI/2;
            habitatGroup.add(ground);
        }

        function createStars() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 10000;
            const posArray = new Float32Array(starCount * 3);
            for(let i = 0; i < starCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 5000;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars); 
        }

        function createWorldFeatures() {
            const radius = 649.8;

            // River as a band around the circumference
            const riverGeo = new THREE.CylinderGeometry(radius - 0.3, radius - 0.3, 15, 64, 1, true);
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x2a6099, side: THREE.BackSide, metalness: 0.4, roughness: 0.3 });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = Math.PI / 2;
            river.position.z = 20;
            habitatGroup.add(river);

            createTown(new THREE.Vector3(400, -500, 0), 40);
            createTown(new THREE.Vector3(-450, -470, -15), 30);
            createForest(1000);
        }

        function createTown(center, count) {
            const radius = 649.5;
            const houseBaseGeo = new THREE.BoxGeometry(8, 6, 8);
            const houseRoofGeo = new THREE.ConeGeometry(7, 4, 4);

            for (let i = 0; i < count; i++) {
                const offsetTheta = (Math.random() - 0.5) * 0.4;
                const offsetZ = (Math.random() - 0.5) * 60;
                const baseAngle = Math.atan2(center.y, center.x);
                const theta = baseAngle + offsetTheta;
                const z = center.z + offsetZ;

                const group = new THREE.Group();
                const base = new THREE.Mesh(houseBaseGeo, new THREE.MeshStandardMaterial({ color: 0xd4c4a8 }));
                const roof = new THREE.Mesh(houseRoofGeo, new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                base.position.y = 3;
                roof.position.y = 8;
                group.add(base, roof);

                group.position.set(radius * Math.cos(theta), radius * Math.sin(theta), z);
                group.lookAt(0, 0, z);
                group.rotateX(Math.PI / 2);
                habitatGroup.add(group);
            }
        }

        function createForest(count) {
            const radius = 649.5;
            const length = 120;
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.5, 8);
            const leavesGeo = new THREE.SphereGeometry(4, 8, 8);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3520 });

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                // Bias z toward edges (endcaps): invert squared random so trees cluster at high |z|
                const edgeBias = 1 - Math.pow(Math.random(), 2);
                const z = Math.sign(Math.random() - 0.5) * edgeBias * (length / 2);

                const group = new THREE.Group();
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                const leaves = new THREE.Mesh(leavesGeo, leafMat);
                trunk.position.y = 4;
                leaves.position.y = 10;
                group.add(trunk, leaves);

                group.position.set(radius * Math.cos(theta), radius * Math.sin(theta), z);
                group.lookAt(0, 0, z);
                group.rotateX(Math.PI / 2);
                habitatGroup.add(group);
            }
        }

        function updateMovement() {
            const currentPos = new THREE.Vector2(cameraAnchor.position.x, cameraAnchor.position.y);
            const angle = Math.atan2(currentPos.y, currentPos.x);
            
            cameraAnchor.rotation.z = angle - Math.PI/2 + Math.PI;

            const direction = new THREE.Vector3();
            const front = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

            if (moveState.forward) direction.add(front);
            if (moveState.backward) direction.sub(front);
            if (moveState.right) direction.add(right);
            if (moveState.left) direction.sub(right);
            if (moveState.up) direction.add(up);
            if (moveState.down) direction.sub(up);

            if (direction.length() > 0) {
                direction.normalize().multiplyScalar(moveSpeed);
                direction.applyQuaternion(cameraAnchor.quaternion);
                cameraAnchor.position.add(direction);
            }

            const distFromCenter = Math.sqrt(cameraAnchor.position.x**2 + cameraAnchor.position.y**2);
            if (distFromCenter > 648) {
                const ratio = 648 / distFromCenter;
                cameraAnchor.position.x *= ratio;
                cameraAnchor.position.y *= ratio;
            } else if (distFromCenter < 3) { // Slightly larger deadzone for the sun bar
                cameraAnchor.position.x = 3.1;
            }
            
            if (Math.abs(cameraAnchor.position.z) > 60) {
                cameraAnchor.position.z = Math.sign(cameraAnchor.position.z) * 60;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            habitatGroup.rotation.z += rotationSpeed;
            stars.rotation.y += 0.00005;

            if (document.pointerLockElement === document.body) {
                updateMovement();
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
