<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanford Torus Simulation</title>
    <link rel="stylesheet" href="/src/styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="overlay">
        <span>Click to Enter</span>
    </div>

    <div id="ui">
        <h2 style="margin: 0 0 5px 0;">Stanford Torus</h2>
        <div class="controls-hint">WASD: Move | SPACE: Jump</div>
        <div class="controls-hint">MOUSE: Look | ESC: Unlock Mouse</div>
        <label class="toggle"><input type="checkbox" id="torus-toggle"> Show Inner Torus</label>
        <label class="toggle">Light <input type="range" id="light-slider" min="0" max="3" step="0.1" value="3"></label>
        <div class="credits">3D Assets by <a href="https://quaternius.com/packs/ultimatenature.html" target="_blank">Quaternius</a></div>
    </div>
    <div id="crosshair"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
